{{define "title"}}Nathejk{{end}}

{{define "content"}}
      <div class="starter-template">
        <h1>Scan</h1>
        {{ if .error }}<div class="alert alert-danger">{{ .error }}</div>{{ end }}
        <p class="lead">For at kunne scanne patruljer skal du logge ind, det gør du ved at skrive dit telefonnummer i feltet herunder</p>
        <form class="form-inline" action="/login" method="post">
            <input type="hidden" name="redir" value="{{ .path }}" />
            <div class="form-group">
                <input type="tel" class="form-control" placeholder="telefonnummer" name="phone" autocomplete="tel">
            </div>
            <button type="submit" class="btn btn-default btn-success">Go</button>
        </form>
      </div>
{{end}}
