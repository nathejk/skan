# staticcheck settings for this package only.
#
# `spejderstatus` is copied in from hq and must stay identical to its origin, like `photo`
# and `kort`. Its test file carries one helper (`recordingWriter.last`) that the tests do
# not currently call, which staticcheck reports as U1000 — and staticcheck exits non-zero,
# so that single finding in somebody else's test code would fail the production image build
# (`docker/Dockerfile` runs `go tool staticcheck ./...` in the `build` stage).
#
# Suppressing it here rather than editing the file keeps the copy byte-identical, and keeps
# the suppression narrow: U1000 stays on everywhere else, where it has already caught real
# dead code in this repo.
#
# Delete this file if the helper is used or removed upstream.
#
# `inherit` rather than `all`: the latter turns on the stylistic ST* checks that
# staticcheck's default set leaves off, which then reported this package's
# `CreateTableSql` naming — a convention every projection here shares.
checks = ["inherit", "-U1000"]
