volumes:
  go:

networks:
  local:
  traefik:
    external: true
  jetstream:
    external: true

services:
  api:
    build:
      context: .
      target: dev
      dockerfile: docker/Dockerfile
    volumes:
    - ./go:/app
    - ./webroot:/webroot
    - go:/go
    networks:
    - local
    - traefik
    - jetstream
    environment:
      #GO_BUILD_FLAGS: -race
      YEAR: 2026
      FOTO_BASE_URL: https://foto.local.nathejk.dk
      # Guards /qr and /geo. Deliberately unrelated to SECRET, because this one
      # travels in query strings. Real value belongs in docker-compose.override.yml.
      EXPORT_TOKEN: dev-export-token
      JETSTREAM_DSN: "nats://jetstream:4222"
      # multiStatements is required by the spejderstatus projection, whose table.sql
      # declares two tables and is consumed as one statement. kort avoids this by
      # embedding its second schema separately; that package does not.
      #
      # Note the trade-off it brings: stacked queries become possible, so a quoting bug in
      # a consumer would no longer be limited to one statement. Values come from our own
      # event stream and go through tables.Quote, but that is why the quoting matters.
      DB_DSN: root:ib@tcp(mysql:3306)/skan?parseTime=true&multiStatements=true
      SMS_DSN: cpsms://TOKEN@api.cpsms.dk
      REDIS_ADDR: redis:6379
      SECRET: nh2025
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # The container listens on 80, which is Traefik's default, so this label is not
      # needed to pick the port. It is here to *name* the service `skan`: both routers
      # below name their service explicitly, and Traefik's implicit service for this
      # container is `api-skan`. Without this, both routers fail with
      # "the service \"skan@docker\" does not exist" and are disabled.
      traefik.http.services.skan.loadbalancer.server.port: "80"

      # Serve BOTH http and https (org rules pattern 3), rather than redirecting
      # http to https.
      #
      # The redirect pattern is quietly wrong here. Traefik's redirectscheme answers
      # 302, and a client following a 302 on a POST turns it into a GET and drops the
      # body — browsers do this too. Every scan this app records is a form POST or a
      # PUT: `POST /` (manual team-number entry), `POST /map/{id}/{cs}` (binding a QR
      # code to a patrulje) and `PUT /register` (the geolocation call). A scan lost to
      # a redirect is a catch that never happened, with nothing in the logs to suggest
      # why.
      #
      # Serving both is safe here because the printed stickers already carry https:
      # `qrHandler` generates `https://<host>/qr/<id>/<cs>`, so scanners arrive over
      # TLS and get a secure context for navigator.geolocation without a redirect.
      # A page reached over plain http still works, but the browser withholds
      # geolocation and the scanner falls back to typing a map coordinate.
      #
      # Two routers pointing at one service. Both name the service explicitly,
      # because Traefik cannot infer it when a service has more than one router.
      traefik.http.routers.skan.rule: Host(`skan.local.nathejk.dk`)
      traefik.http.routers.skan.entrypoints: web
      traefik.http.routers.skan.service: skan
      # A router with any tls setting is HTTPS-only, so the cert resolver must sit on
      # the websecure router alone. Putting it on the single router is what makes
      # plain http requests match nothing and collect Traefik's own text/plain 404 —
      # which looks like skan is down, when skan never saw the request.
      traefik.http.routers.skan-secure.rule: Host(`skan.local.nathejk.dk`)
      traefik.http.routers.skan-secure.entrypoints: websecure
      traefik.http.routers.skan-secure.tls.certresolver: desec
      traefik.http.routers.skan-secure.service: skan
    depends_on:
    - mysql

  # The production image is deliberately NOT a service here: `docker compose up`
  # would build it, and the prod stage runs the full test/lint/vuln gate with no
  # source mount. Build it explicitly instead:
  #   docker build -f docker/Dockerfile --target prod -t skan:local .

  mysql:
    image: mariadb:10.8
    environment:
      MYSQL_ROOT_PASSWORD: ib
      MYSQL_DATABASE: skan
      MYSQL_USER: nathejk
      MYSQL_PASSWORD: kodeord
      TZ: Europe/Copenhagen
    networks:
    - local

  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DEFAULT_USER: nathejk
      ADMINER_DEFAULT_PASSWORD: kodeord
      ADMINER_DEFAULT_DB: skan
    networks:
    - local
    - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.skan-sql.rule: Host(`mysql.skan.local.nathejk.dk`)
      # Required: adminer listens on 8080, not Traefik's default 80.
      traefik.http.services.skan-sql.loadbalancer.server.port: "8080"
    depends_on:
    - mysql

  redis:
    image: redis:4.0-alpine3.8
    entrypoint: redis-server --appendonly yes
    networks:
    - local

  redis-commander:
    image: rediscommander/redis-commander:latest
    platform: linux/x86_64
    environment:
      REDIS_HOSTS: skan:redis:6379
    networks:
    - local
    - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.skan-redis.rule: Host(`redis.skan.local.nathejk.dk`)
      # Required: redis-commander listens on 8081, not Traefik's default 80.
      traefik.http.services.skan-redis.loadbalancer.server.port: "8081"
